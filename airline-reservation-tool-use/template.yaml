AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: airline-reservation-tool-use

Mappings:
  Model:
    Id:
      Value: "arn:aws:bedrock:us-east-1::foundation-model/amazon.nova-pro-v1:0"
    SystemPrompt: 
      Value: |
        ## Task\n
        You are an AI assistant that helps owners book their private jets. Your task is to extract and interpret relevant information from minimal owner conversations to facilitate jet booking.

        ## Instructions\n
        1. Review the owner's conversation carefully.
        2. Identify any mentions of dates or times and convert them to the appropriate Zulu format (e.g., '5 days from now' should be converted to a parsable date format string).
        3. Recognize any airport names or locations mentioned and provide the corresponding ICAO airport codes (e.g., KCMH for Columbus, KJFK for New York JFK).
        4. If a location is mentioned without a specific airport, determine the nearest major airport to that location and provide its ICAO code.
        5. Extract any other relevant details, such as departure and arrival times, number of passengers, or special requests.
        6. Consolidate all the extracted information into a concise and structured format, ready for booking.

        ## Example\n
        ### Owner Conversation\n
        'I will be flying from the big apple to London leaving after 3pm.'

        ### Interpretation\n
        Departure Airport: KJFK (New York JFK)\n
        Arrival Airport: EGLL (London Heathrow)\n
        Departure Time: After 15:00Z (based on the provided 'after 3pm' information)\n

        Provide your response immediately without any preamble or additional information.

Resources:
  ReservationStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      DefinitionUri: statemachine/book_reservation.asl.json
      DefinitionSubstitutions:
        GetOwnerInfoFunctionArn: !GetAtt GetOwnerInfoFunction.Arn
        BookReservationFunctionArn: !GetAtt BookReservationFunction.Arn
        GetPassengersFunctionArn: !GetAtt GetPassengersFunction.Arn
        GetDateTimeFunctionArn: !GetAtt GetDateTimeFunction.Arn
        BedrockModelId: !FindInMap ["Model", "Id", "Value"]
        SystemPrompt: !FindInMap ["Model", "SystemPrompt", "Value"]
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref GetOwnerInfoFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref GetPassengersFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref BookReservationFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref GetDateTimeFunction                        
        - Version: '2012-10-17' 
          Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: !FindInMap ["Model", "Id", "Value"]

  GetOwnerInfoFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/customer/
      Handler: app.lambdaHandler
      Runtime: nodejs20.x
      Architectures:
        - arm64

  GetPassengersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/passenger/
      Handler: app.lambdaHandler
      Runtime: nodejs20.x
      Architectures:
        - arm64

  BookReservationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/reservation/
      Handler: app.lambdaHandler
      Runtime: nodejs20.x
      Architectures:
        - arm64
  
  GetDateTimeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/utils/time/
      Handler: app.lambdaHandler
      Runtime: nodejs20.x
      Architectures:
        - arm64

Outputs:
  ReservationStateMachineArn:
    Description: "Reservation state machine ARN"
    Value: !Ref ReservationStateMachine
